<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifre Sıfırla | CafeMenu Digital Card</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="nav container"><a class="logo" href="/">CafeMenu Digital Card</a></div>
<div class="auth-wrap">
  <h1>Yeni Şifre Belirle</h1>
  <p class="form-error" id="err"></p>
  <form id="form">
    <div class="field"><label>Sıfırlama Token</label><input name="token" required></div>
    <div class="field"><label>Yeni Şifre</label><input type="password" name="password" required minlength="8"></div>
    <button class="btn" type="submit" style="width:100%">Şifreyi Güncelle</button>
  </form>
  <p class="form-note"><a href="/login">Girişe dön</a></p>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const data = Object.fromEntries(new FormData(e.target).entries());
  const res = await fetch('/api/auth/reset-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
  });
  const json = await res.json();
  if (!res.ok) { err.textContent = json.message || 'Hata oluştu.'; return; }
  err.style.color = '#111827';
  err.textContent = 'Şifreniz güncellendi. Giriş yapabilirsiniz.';
});
</script>
</body>
</html>
