<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifremi Unuttum | CafeMenu Digital Card</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="nav container"><a class="logo" href="/">CafeMenu Digital Card</a></div>
<div class="auth-wrap">
  <h1>Şifremi Unuttum</h1>
  <p class="form-error" id="err"></p>
  <form id="form">
    <div class="field"><label>E-posta</label><input type="email" name="email" required></div>
    <button class="btn" type="submit" style="width:100%">Sıfırlama Bağlantısı Gönder</button>
  </form>
  <p class="form-note"><a href="/login">Girişe dön</a></p>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const data = Object.fromEntries(new FormData(e.target).entries());
  const res = await fetch('/api/auth/forgot-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
  });
  const json = await res.json();
  err.style.color = '#111827';
  err.textContent = json.message || 'Eğer bu e-posta kayıtlıysa bağlantı gönderildi.';
});
</script>
</body>
</html>
